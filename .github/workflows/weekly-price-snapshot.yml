name: Weekly Price Snapshot

# Runs every Monday at 3 AM UTC (6 AM Cairo time)
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  scrape-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: nawy-scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          cd nawy-scraper
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run Price Snapshot Scraper
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          cd nawy-scraper
          python scrape_price_snapshot.py --pages 100

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: nawy-scraper/price_snapshot.log
          retention-days: 30
